name: Corpus Research & Source Notebook Validation

on:
  pull_request:
    paths:
      - 'corpus-research-engine.js'
      - 'corpus-research-ui.js'
      - 'corpus-research.css'
      - 'corpus-research-workbench-bridge.js'
      - 'corpus-research-portability.js'
      - 'index.html'
      - 'scripts/test-corpus-research.cjs'
      - 'scripts/test-corpus-research-browser.mjs'
      - '.github/workflows/corpus-research-validation.yml'
      - 'CORPUS_RESEARCH_V1_8.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check corpus-research-engine.js
          node --check corpus-research-ui.js
          node --check corpus-research-workbench-bridge.js
          node --check corpus-research-portability.js
          node --check scripts/test-corpus-research.cjs
          node --check scripts/test-corpus-research-browser.mjs
      - name: Validate deterministic corpus research contract
        run: |
          node scripts/test-corpus-research.cjs
          node scripts/test-passage-workbench.cjs
          node scripts/test-reading-goals.cjs
      - name: Build and validate pinned full NT corpus
        run: |
          node scripts/build-full-corpus.mjs
          node scripts/validate-full-corpus.mjs
      - name: Build and inspect PWA shell
        run: |
          node scripts/build-pwa-shell.mjs
          node - <<'NODE'
          const p=require('./generated/pwa-shell.json');
          for(const a of ['corpus-research-engine.js','corpus-research-ui.js','corpus-research.css','corpus-research-workbench-bridge.js','corpus-research-portability.js'])if(!p.assets.includes(a))throw new Error('PWA shell asset missing: '+a);
          console.log('V1.8 research assets are present in the generated offline shell.');
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 > /tmp/koine-v18-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/koine-v18-http.log
          exit 1
      - name: Exercise corpus research in Chromium
        env:
          KOINE_TEST_URL: http://127.0.0.1:4173/
        run: node scripts/test-corpus-research-browser.mjs
      - name: Preserve research mastery firewall
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const file of ['corpus-research-engine.js','corpus-research-ui.js','corpus-research-workbench-bridge.js']){
            const text=fs.readFileSync(file,'utf8');
            for(const forbidden of ['recordEvidence','recordExposure','recordHint'])if(text.includes(forbidden))throw new Error(`${file} contains forbidden mastery write path ${forbidden}`);
          }
          console.log('V1.8 corpus-research mastery firewall: PASS');
          NODE
