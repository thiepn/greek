name: Adaptive Weekly Planning Validation

on:
  pull_request:
    paths:
      - 'weekly-planning-engine.js'
      - 'weekly-planning-ui.js'
      - 'weekly-planning.css'
      - 'index.html'
      - 'app.js'
      - 'data-portability.js'
      - 'data-portability-ui.js'
      - 'scripts/test-weekly-planning.cjs'
      - 'scripts/test-weekly-planning-browser.mjs'
      - '.github/workflows/weekly-planning-validation.yml'
      - 'WEEKLY_PLANNING_V1_5.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check weekly-planning-engine.js
          node --check weekly-planning-ui.js
          node --check data-portability.js
          node --check scripts/test-weekly-planning.cjs
          node --check scripts/test-weekly-planning-browser.mjs
      - name: Validate deterministic weekly planning contract
        run: node scripts/test-weekly-planning.cjs
      - name: Build pinned full NT corpus
        run: node scripts/build-full-corpus.mjs
      - name: Build and inspect PWA shell
        run: |
          node scripts/build-pwa-shell.mjs
          node -e "const p=require('./generated/pwa-shell.json');for(const a of ['weekly-planning-engine.js','weekly-planning-ui.js','weekly-planning.css'])if(!p.assets.includes(a))throw new Error('PWA shell asset missing: '+a);console.log('V1.5 assets are present in the generated offline shell.')"
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 > /tmp/koine-v15-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/koine-v15-http.log
          exit 1
      - name: Exercise weekly planning and forecasts in Chromium
        env:
          KOINE_TEST_URL: http://127.0.0.1:4173/
        run: node scripts/test-weekly-planning-browser.mjs
      - name: Preserve planning mastery firewall
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const file of ['weekly-planning-engine.js','weekly-planning-ui.js']){
            const text=fs.readFileSync(file,'utf8');
            for(const forbidden of ['recordEvidence','recordExposure','recordHint'])if(text.includes(forbidden))throw new Error(`${file} contains forbidden mastery write path ${forbidden}`);
          }
          console.log('V1.5 planning mastery firewall: PASS');
          NODE
