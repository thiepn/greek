name: Scholarly Source Library Validation

on:
  pull_request:
    paths:
      - 'source-library-engine.js'
      - 'source-library-ui.js'
      - 'source-library-synthesis-bridge.js'
      - 'source-library-portability.js'
      - 'source-library.css'
      - 'corpus-research-engine.js'
      - 'research-synthesis-engine.js'
      - 'index.html'
      - 'data-portability.js'
      - 'scripts/test-source-library.cjs'
      - 'scripts/test-source-library-browser.mjs'
      - 'scripts/test-corpus-research.cjs'
      - 'scripts/test-corpus-research-browser.mjs'
      - 'scripts/test-research-synthesis.cjs'
      - 'scripts/test-research-synthesis-browser.mjs'
      - 'scripts/test-passage-workbench.cjs'
      - '.github/workflows/source-library-validation.yml'
      - 'SOURCE_LIBRARY_V1_10.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check source-library-engine.js
          node --check source-library-ui.js
          node --check source-library-synthesis-bridge.js
          node --check source-library-portability.js
          node --check scripts/test-source-library.cjs
          node --check scripts/test-source-library-browser.mjs
      - name: Validate deterministic source-library contract
        run: |
          node scripts/test-source-library.cjs
          node scripts/test-research-synthesis.cjs
          node scripts/test-corpus-research.cjs
          node scripts/test-passage-workbench.cjs
      - name: Build and validate pinned full NT corpus
        run: |
          node scripts/build-full-corpus.mjs
          node scripts/validate-full-corpus.mjs
      - name: Build and inspect PWA shell
        run: |
          node scripts/build-pwa-shell.mjs
          node - <<'NODE'
          const p=require('./generated/pwa-shell.json');
          for(const a of ['source-library-engine.js','source-library-ui.js','source-library-synthesis-bridge.js','source-library-portability.js','source-library.css'])if(!p.assets.includes(a))throw new Error('PWA shell asset missing: '+a);
          console.log('V1.10 source-library assets are present in the generated offline shell.');
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 > /tmp/koine-v110-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/koine-v110-http.log
          exit 1
      - name: Exercise scholarly source library in Chromium
        env:
          KOINE_TEST_URL: http://127.0.0.1:4173/
        run: node scripts/test-source-library-browser.mjs
      - name: Preserve source-library mastery and authority firewalls
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const file of ['source-library-engine.js','source-library-ui.js','source-library-synthesis-bridge.js']){
            const text=fs.readFileSync(file,'utf8');
            for(const forbidden of ['recordEvidence','recordExposure','recordHint'])if(text.includes(forbidden))throw new Error(`${file} contains forbidden mastery write path ${forbidden}`);
          }
          const engine=fs.readFileSync('source-library-engine.js','utf8');
          for(const forbidden of ['authorityScore','qualityScore','truthScore','consensusScore'])if(engine.includes(forbidden))throw new Error(`source-library-engine.js contains forbidden automatic score ${forbidden}`);
          console.log('V1.10 source-library mastery and authority firewalls: PASS');
          NODE
