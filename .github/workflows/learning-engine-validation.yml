name: Learning Engine Validation

on:
  pull_request:
    paths:
      - 'learning-engine.js'
      - 'learning-engine-ui.js'
      - 'learning-engine.css'
      - 'app.js'
      - 'canonical-reader.js'
      - 'curriculum.js'
      - 'scripts/test-learning-engine.cjs'
      - '.github/workflows/learning-engine-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run learning engine tests
        run: node scripts/test-learning-engine.cjs
