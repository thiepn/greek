name: Reading Goals & Corpus Tracks Validation

on:
  pull_request:
    paths:
      - 'data/reading-tracks.js'
      - 'reading-goals-engine.js'
      - 'reading-goals-ui.js'
      - 'reading-goals.css'
      - 'session-ui.js'
      - 'weekly-planning-ui.js'
      - 'index.html'
      - 'app.js'
      - 'data-portability.js'
      - 'data-portability-ui.js'
      - 'scripts/test-reading-goals.cjs'
      - 'scripts/test-reading-goals-browser.mjs'
      - '.github/workflows/reading-goals-validation.yml'
      - 'READING_GOALS_V1_6.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check reading-goals-engine.js
          node --check reading-goals-ui.js
          node --check data/reading-tracks.js
          node --check session-ui.js
          node --check weekly-planning-ui.js
          node --check data-portability.js
          node --check scripts/test-reading-goals.cjs
          node --check scripts/test-reading-goals-browser.mjs
      - name: Validate deterministic reading-goal contract
        run: node scripts/test-reading-goals.cjs
      - name: Build and validate pinned full NT corpus
        run: |
          node scripts/build-full-corpus.mjs
          node scripts/validate-full-corpus.mjs
      - name: Build and inspect PWA shell
        run: |
          node scripts/build-pwa-shell.mjs
          node -e "const p=require('./generated/pwa-shell.json');for(const a of ['reading-goals-engine.js','reading-goals-ui.js','reading-goals.css','data/reading-tracks.js'])if(!p.assets.includes(a))throw new Error('PWA shell asset missing: '+a);console.log('V1.6 reading-goal assets are present in the generated offline shell.')"
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 > /tmp/koine-v16-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/koine-v16-http.log
          exit 1
      - name: Exercise reading goals and corpus tracks in Chromium
        env:
          KOINE_TEST_URL: http://127.0.0.1:4173/
        run: node scripts/test-reading-goals-browser.mjs
      - name: Preserve reading-goal mastery firewall
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const file of ['reading-goals-engine.js','reading-goals-ui.js']){
            const text=fs.readFileSync(file,'utf8');
            for(const forbidden of ['recordEvidence','recordExposure','recordHint'])if(text.includes(forbidden))throw new Error(`${file} contains forbidden mastery write path ${forbidden}`);
          }
          console.log('V1.6 reading-goal mastery firewall: PASS');
          NODE
