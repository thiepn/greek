name: Publication Packages & DOCX/PDF Validation

on:
  pull_request:
    paths:
      - 'publication-package-engine.js'
      - 'publication-package-ui.js'
      - 'publication-package.css'
      - 'publication-package-portability.js'
      - 'publication-engine.js'
      - 'publication-ui.js'
      - 'publication-portability.js'
      - 'source-library-engine.js'
      - 'research-synthesis-engine.js'
      - 'index.html'
      - 'data-portability-ui.js'
      - 'scripts/test-publication-packages.cjs'
      - 'scripts/test-publication-packages-browser.mjs'
      - 'scripts/test-publication.cjs'
      - 'scripts/test-source-library.cjs'
      - 'scripts/test-research-synthesis.cjs'
      - 'scripts/test-corpus-research.cjs'
      - 'scripts/test-passage-workbench.cjs'
      - '.github/workflows/publication-packages-validation.yml'
      - 'PUBLICATION_PACKAGES_V1_12.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check publication-package-engine.js
          node --check publication-package-ui.js
          node --check publication-package-portability.js
          node --check scripts/test-publication-packages.cjs
          node --check scripts/test-publication-packages-browser.mjs
      - name: Validate deterministic package contract
        run: |
          node scripts/test-publication-packages.cjs
          node scripts/test-publication.cjs
          node scripts/test-source-library.cjs
          node scripts/test-research-synthesis.cjs
          node scripts/test-corpus-research.cjs
          node scripts/test-passage-workbench.cjs
      - name: Build and validate pinned full NT corpus
        run: |
          node scripts/build-full-corpus.mjs
          node scripts/validate-full-corpus.mjs
      - name: Build and inspect PWA shell
        run: |
          node scripts/build-pwa-shell.mjs
          node - <<'NODE'
          const p=require('./generated/pwa-shell.json');
          for(const a of ['publication-package-engine.js','publication-package-ui.js','publication-package.css','publication-package-portability.js'])if(!p.assets.includes(a))throw new Error('PWA shell asset missing: '+a);
          console.log('V1.12 publication-package assets are present in the generated offline shell.');
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 > /tmp/koine-v112-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/koine-v112-http.log
          exit 1
      - name: Exercise publication packages in Chromium
        env:
          KOINE_TEST_URL: http://127.0.0.1:4173/
        run: node scripts/test-publication-packages-browser.mjs
      - name: Preserve package mastery and authority firewalls
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const file of ['publication-package-engine.js','publication-package-ui.js']){
            const text=fs.readFileSync(file,'utf8');
            for(const forbidden of ['recordEvidence','recordExposure','recordHint'])if(text.includes(forbidden))throw new Error(`${file} contains forbidden mastery write path ${forbidden}`);
            for(const forbidden of ['authorityScore','qualityScore','truthScore','consensusScore','readinessScore'])if(text.includes(forbidden))throw new Error(`${file} contains forbidden authority/readiness scoring path ${forbidden}`);
          }
          console.log('V1.12 package mastery/authority firewall: PASS');
          NODE
