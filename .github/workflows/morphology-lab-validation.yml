name: Morphology Lab Validation

on:
  pull_request:
    paths:
      - 'data/morphology-lab-data.js'
      - 'morphology-lab.js'
      - 'morphology-lab-ui.js'
      - 'morphology-lab.css'
      - 'scripts/test-morphology-lab.cjs'
      - '.github/workflows/morphology-lab-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run morphology laboratory tests
        run: node scripts/test-morphology-lab.cjs